<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bionova Pro — Inscription Professionnel</title>
  
  <base href="/wp-content/themes/bionova-site/bionova-admin/">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/admin.css">
</head>
<body>

  <!-- Header -->
  <header class="header">
    <img src="../assets/brand/logo-bionova.webp" alt="Logo Bionova" class="header__logo" height="50">
    <h1 class="header__title">Inscription Professionnel</h1>
  </header>

  <main class="container">

    <section class="card">
      <h2 class="section-title">📝 Données du Médecin</h2>

      <form id="pro-form" class="pro-form">

        <!-- Code promo (pré-rempli, lecture seule) -->
        <div class="form-group">
          <label for="promo-code">Code Promo (QR scanné)</label>
          <input type="text" id="promo-code" readonly class="input-readonly" placeholder="—">
        </div>

        <div class="form-grid-2">
          <div class="form-group">
            <label for="pro-nom">Nom</label>
            <input type="text" id="pro-nom" placeholder="Ex: Ben Ali" required autocomplete="off">
          </div>
          <div class="form-group">
            <label for="pro-prenom">Prénom</label>
            <input type="text" id="pro-prenom" placeholder="Ex: Mohamed" required autocomplete="off">
          </div>
        </div>

        <div class="form-grid-2">
          <div class="form-group">
            <label for="pro-email">Email</label>
            <input type="email" id="pro-email" placeholder="email@exemple.com" required autocomplete="off">
          </div>
          <div class="form-group">
            <label for="pro-phone">Téléphone</label>
            <div class="input-prefix-wrapper">
              <span class="input-prefix">+216</span>
              <input type="tel" id="pro-phone" placeholder="12345678" required autocomplete="off" maxlength="8" pattern="[0-9\s]*">
            </div>
          </div>
        </div>

        <div class="form-group">
          <label for="pro-speciality">Spécialité</label>
          <select id="pro-speciality" required>
            <option value="">— Choisir une spécialité —</option>
            <option value="Médecin Généraliste">Médecin Généraliste</option>
            <option value="Cardiologue">Cardiologue</option>
            <option value="Dermatologue">Dermatologue</option>
            <option value="Endocrinologue">Endocrinologue</option>
            <option value="Gastro-entérologue">Gastro-entérologue</option>
            <option value="Gynécologue">Gynécologue</option>
            <option value="Neurologue">Neurologue</option>
            <option value="Ophtalmologue">Ophtalmologue</option>
            <option value="ORL">ORL (Oto-Rhino-Laryngologiste)</option>
            <option value="Orthopédiste">Orthopédiste</option>
            <option value="Pédiatre">Pédiatre</option>
            <option value="Pneumologue">Pneumologue</option>
            <option value="Psychiatre">Psychiatre</option>
            <option value="Rhumatologue">Rhumatologue</option>
            <option value="Urologue">Urologue</option>
            <option value="Médecin du sport">Médecin du sport</option>
            <option value="Nutritionniste">Nutritionniste</option>
            <option value="Pharmacien">Pharmacien</option>
            <option value="Autre">Autre</option>
          </select>
        </div>

        <!-- Login & Mot de passe (auto-générés) -->
        <div class="form-grid-2">
          <div class="form-group">
            <label for="pro-login">Login (auto-généré)</label>
            <input type="text" id="pro-login" readonly class="input-readonly" placeholder="—">
          </div>
          <div class="form-group">
            <label for="pro-password">Mot de passe (auto-généré)</label>
            <input type="text" id="pro-password" readonly class="input-readonly" placeholder="—">
          </div>
        </div>

        <!-- Message de statut -->
        <div id="form-msg" class="msg" style="display:none;"></div>

        <!-- 3 Boutons de validation -->
        <div class="form-actions">
          <button type="button" data-action="whatsapp" class="btn btn--whatsapp" disabled>
            <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
            Valider par WhatsApp
          </button>
          <button type="button" data-action="sms" class="btn btn--sms" disabled>
            <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>
            Valider par SMS
          </button>
          <button type="button" data-action="mail" class="btn btn--mail" disabled>
            <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
            Valider par Email
          </button>
        </div>

      </form>
    </section>

  </main>

  <script src="js/form.js"></script>
</body>
</html>
