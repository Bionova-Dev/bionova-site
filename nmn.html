<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NMN - Bionova | Laboratoire de Parapharmacie</title>
  <meta name="description" content="Découvrez NMN de Bionova. Le précurseur ultime du NAD+. Une avancée scientifique majeure pour l'énergie cellulaire et la réparation de l'ADN. Expertise micronutritionnelle et compléments naturels en Tunisie.">
  <meta name="robots" content="index, follow">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { 'medical-blue': '#075985', 'medical-light': '#f0fdf4', 'bionova-red': '#be123c', 'silver': '#f1f5f9' },
          fontFamily: { sans: ['Inter', 'sans-serif'], display: ['Montserrat', 'sans-serif'] }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Montserrat:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #ffffff; color: #1e293b; }
    html { scroll-behavior: smooth; }
    .btn-gradient { background: linear-gradient(135deg, #075985 0%, #0ea5e9 100%); transition: all 0.3s ease; }
    .btn-gradient:hover { filter: brightness(1.1); transform: translateY(-2px); box-shadow: 0 10px 20px -5px rgba(7, 89, 133, 0.3); }
    .badge-shiny { background: linear-gradient(110deg, #be123c 0%, #fb7185 25%, #be123c 50%, #fb7185 75%, #be123c 100%); background-size: 200% 100%; animation: shine 3s linear infinite; }
    @keyframes shine { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    .perspective-1000 { perspective: 1000px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const product = {
    "id": 10,
    "slug": "nmn",
    "name": "NMN",
    "description": "Le pr\u00e9curseur ultime du NAD+. Une avanc\u00e9e scientifique majeure pour l'\u00e9nergie cellulaire et la r\u00e9paration de l'ADN.",
    "price": 22.5,
    "image": "./produits/nmn.png",
    "rating": 5.0,
    "reviews": 67,
    "composition": "Uthever\u00ae NMN (B\u00eata-Nicotinamide Mononucl\u00e9otide) : 250mg.",
    "benefits": [
        "Boost d'ATP (\u00e9nergie)",
        "R\u00e9paration de l'ADN",
        "Optimisation m\u00e9tabolique"
    ],
    "usage": "1 g\u00e9lule le matin \u00e0 jeun (sublingual possible).",
    "precautions": "Destin\u00e9 \u00e0 un usage adulte uniquement.",
    "storage": "\u00c0 conserver de pr\u00e9f\u00e9rence au r\u00e9frig\u00e9rateur."
};
    const ShoppingCartIcon = ({ className = "w-6 h-6" }) => (<svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" /></svg>);
    const ShieldIcon = ({ className = "w-6 h-6" }) => (<svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" /></svg>);
    const TruckIcon = ({ className = "w-6 h-6" }) => (<svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M8 14H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-3m-1 4a2 2 0 100-4 2 2 0 000 4zm-8 0a2 2 0 100-4 2 2 0 000 4z" /></svg>);
    const StarIcon = ({ className = "w-4 h-4" }) => (<svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z" /></svg>);
    const ChevronDownIcon = ({ className = "w-6 h-6" }) => (<svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 9l-7 7-7-7" /></svg>);
    const UserIcon = ({ className = "w-6 h-6" }) => (<svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>);
    const SearchIcon = ({ className = "w-6 h-6" }) => (<svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>);
    const BioIcon = ({ className = "w-4 h-4" }) => (<svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707m12.728 0l-.707-.707M6.343 6.343l-.707-.707M12 8a4 4 0 100 8 4 4 0 000-8z" /></svg>);

    const Navbar = () => (
      <header className="fixed w-full z-50 h-[180px] bg-white shadow-md border-b border-gray-100 flex items-center">
        <nav className="max-w-7xl mx-auto px-6 lg:px-12 w-full h-full flex justify-between items-center">
          <a href="index.html" className="flex items-center group">
            <img src="logo-bionova.png" alt="Logo Bionova" className="h-[120px] md:h-[150px] transition-transform group-hover:scale-[1.02]" />
          </a>
          <div className="hidden lg:flex space-x-12">
            <a href="index.html" className="text-2xl font-bold uppercase tracking-widest text-gray-900 hover:text-medical-blue transition-colors">Accueil</a>
            <a href="index.html#products" className="text-2xl font-bold uppercase tracking-widest text-gray-900 hover:text-medical-blue transition-colors">Boutique</a>
            <a href="index.html#blog" className="text-2xl font-bold uppercase tracking-widest text-gray-900 hover:text-medical-blue transition-colors">Astuces</a>
            <a href="index.html#about" className="text-2xl font-bold uppercase tracking-widest text-gray-900 hover:text-medical-blue transition-colors">Expertise</a>
            <a href="index.html#contact" className="text-2xl font-bold uppercase tracking-widest text-gray-900 hover:text-medical-blue transition-colors">Contact</a>
          </div>
          <div className="flex items-center space-x-4">
            <button className="p-3 text-gray-900 hover:text-medical-blue" title="Rechercher"><SearchIcon /></button>
            <button className="p-3 text-gray-900 hover:text-medical-blue" title="Mon compte"><UserIcon /></button>
            <button className="p-3.5 bg-gray-900 text-white rounded-2xl shadow-lg hover:bg-medical-blue transition-all" title="Panier"><ShoppingCartIcon /></button>
          </div>
        </nav>
      </header>
    );

    const Accordion = ({ title, content }) => {
      const [isOpen, setIsOpen] = React.useState(false);
      return (
        <div className="border-b border-gray-100 py-5">
          <button className="flex w-full justify-between items-center text-left focus:outline-none group" onClick={() => setIsOpen(!isOpen)}>
            <span className="font-display font-semibold text-lg text-gray-900 group-hover:text-medical-blue transition-colors">{title}</span>
            <div className={`p-2 rounded-full bg-gray-50 group-hover:bg-blue-50 transition-colors`}>
              <ChevronDownIcon className={`w-5 h-5 text-gray-500 group-hover:text-medical-blue transition-transform duration-300 ${isOpen ? 'rotate-180' : ''}` } />
            </div>
          </button>
          <div className={`mt-2 text-gray-600 leading-relaxed overflow-hidden transition-all duration-300 ${isOpen ? 'max-h-96 opacity-100 mb-4' : 'max-h-0 opacity-0'}`}>
            <div className="pr-12">{content}</div>
          </div>
        </div>
      );
    };

    const InteractiveProductViewer = ({ src, alt }) => {
      const cardRef = React.useRef(null);
      const [rotation, setRotation] = React.useState({ x: 0, y: 0 });
      const handleMouseMove = (e) => {
        if (!cardRef.current) return;
        const box = cardRef.current.getBoundingClientRect();
        const x = e.clientX - box.left;
        const y = e.clientY - box.top;
        const centerX = box.width / 2;
        const centerY = box.height / 2;
        setRotation({ x: ((y - centerY) / centerY) * -15, y: ((x - centerX) / centerX) * 15 });
      };
      return (
        <div className="relative perspective-1000 w-full aspect-square bg-gray-50 rounded-[3rem] border border-gray-100 shadow-sm flex items-center justify-center overflow-hidden" onMouseMove={handleMouseMove} onMouseLeave={() => setRotation({ x: 0, y: 0 })}>
          <img ref={cardRef} src={src} alt={alt} className="w-full h-full p-12 object-contain drop-shadow-2xl transition-transform duration-300 ease-out" style={{ transform: `rotateX(${rotation.x}deg) rotateY(${rotation.y}deg) scale(1.05)` }} />
        </div>
      );
    };

    const ProductPage = () => {
      return (
        <div className="min-h-screen flex flex-col">
          <Navbar />
          <main className="flex-grow pt-40 pb-20">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <a href="index.html" className="group flex items-center text-gray-500 hover:text-medical-blue font-semibold tracking-wide uppercase text-sm transition-colors mb-12">
                <span className="transform transition-transform group-hover:-translate-x-2 mr-3 text-lg">&larr;</span> Retour à la boutique
              </a>
              <div className="grid grid-cols-1 lg:grid-cols-2 gap-16 lg:gap-24 items-center mb-20">
                <InteractiveProductViewer src={product.image} alt={product.name} />
                <div className="flex flex-col">
                  <div className="mb-4">
                    <span className="px-3 py-1 bg-gray-100 text-gray-600 rounded-full text-xs font-bold tracking-widest uppercase">{product.type === 'pack' ? 'Pack Promo' : 'Complément Alimentaire'}</span>
                  </div>
                  <h1 className="font-display text-4xl lg:text-6xl font-black text-gray-900 mb-6 leading-tight">{product.name}</h1>
                  <div className="flex items-center space-x-1 mb-8">
                    {[...Array(5)].map((_, i) => <StarIcon key={i} className={`w-5 h-5 ${i < Math.floor(product.rating) ? 'text-yellow-400 fill-yellow-400' : 'text-gray-200'}` } />)}
                    <span className="text-sm font-bold text-gray-400 ml-4">{product.rating}/5 - {product.reviews} avis clients</span>
                  </div>
                  <p className="text-xl text-gray-500 leading-relaxed mb-10">{product.description}</p>
                  <div className="flex items-baseline space-x-4 mb-10">
                    <span className="text-5xl font-black text-medical-blue">{product.price.toFixed(2)} DT</span>
                    {product.oldPrice && <span className="text-2xl text-gray-300 line-through font-bold">{product.oldPrice.toFixed(2)} DT</span>}
                  </div>
                  <button className="w-full flex justify-center items-center py-6 px-8 shadow-xl text-xl font-bold rounded-2xl text-white bg-gradient-to-r from-medical-blue to-blue-400 hover:from-blue-600 hover:to-medical-blue transition-all transform hover:-translate-y-1">
                    <ShoppingCartIcon className="w-7 h-7 mr-4" /> Ajouter au panier
                  </button>
                </div>
              </div>
              <div className="grid grid-cols-1 lg:grid-cols-2 gap-20">
                <div className="space-y-12">
                  <section>
                    <h2 className="font-display text-3xl font-bold text-gray-900 mb-8 border-l-4 border-medical-blue pl-6">Bienfaits Scientifiques</h2>
                    <div className="grid grid-cols-1 gap-4">
                      {product.benefits.map((benefit, i) => (
                        <div key={i} className="flex items-center p-5 bg-medical-light/50 rounded-2xl border border-medical-light group hover:bg-medical-light transition-colors">
                          <div className="w-10 h-10 rounded-xl bg-white flex items-center justify-center mr-5 shadow-sm group-hover:scale-110 transition-transform"><BioIcon className="text-medical-blue" /></div>
                          <span className="font-bold text-gray-700">{benefit}</span>
                        </div>
                      ))}
                    </div>
                  </section>
                  <section>
                    <Accordion title="Composition (pour 1 gélule)" content={<div className="bg-gray-50 p-6 rounded-2xl border border-gray-100 text-sm font-medium text-gray-700">{product.composition}</div>} />
                    <Accordion title="Conseils d'utilisation" content={<div className="flex items-start p-2"><TruckIcon className="mr-4 text-medical-blue" /><p className="text-gray-600 leading-relaxed">{product.usage}</p></div>} />
                  </section>
                </div>
                <div className="space-y-12">
                   <section id="reviews">
                    <div className="flex items-center justify-between mb-8">
                      <h2 className="font-display text-3xl font-bold text-gray-900">Avis Clients</h2>
                      <div className="flex items-center space-x-1">
                        {[...Array(5)].map((_, i) => <StarIcon key={i} className="w-5 h-5 text-yellow-400 fill-yellow-400" />)}
                      </div>
                    </div>
                    <div className="space-y-6">
                      {[
                        { name: "Sami B.", date: "Il y a 2 jours", comment: "Excellent produit, je recommande !", rating: 5 },
                        { name: "Linda M.", date: "Il y a 1 semaine", comment: "Très satisfaite de la qualité.", rating: 4 },
                        { name: "Karim T.", date: "Il y a 2 semaines", comment: "Packaging premium et produit efficace.", rating: 5 }
                      ].map((review, idx) => (
                        <div key={idx} className="bg-white p-8 rounded-[2rem] border border-gray-100 hover:shadow-lg transition-shadow">
                          <div className="flex justify-between mb-4">
                            <span className="font-bold">{review.name}</span>
                            <span className="text-xs text-gray-400 uppercase tracking-widest">{review.date}</span>
                          </div>
                          <p className="text-gray-600 italic">"{review.comment}"</p>
                        </div>
                      ))}
                    </div>
                   </section>
                </div>
              </div>
            </div>
          </main>
          <footer className="bg-white border-t border-gray-100 py-12 text-center mt-20">
             <img src="logo-bionova.png" alt="Bionova Logo" className="h-16 mx-auto mb-6 grayscale opacity-50" />
            <p className="text-gray-400 text-sm font-bold uppercase tracking-widest">&copy; 2026 Bionova - Par un professionnel de santé.</p>
          </footer>
        </div>
      );
    };
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<ProductPage />);
  </script>
</body>
</html>
