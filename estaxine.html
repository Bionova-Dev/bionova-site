<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estaxine - Bionova | Laboratoire de Parapharmacie</title>
  <meta name="description" content="Découvrez Estaxine (Astaxanthine Naturelle) par le Laboratoire Bionova. L'antioxydant le plus puissant du monde marin. Une protection d'exception contre le vieillissement cellulaire et les agressions extérieures.">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { 
            'medical-blue': '#075985', 
            'nude-soft': '#FDF8F6',
            'nude-warm': '#F9F1EE'
          },
          fontFamily: { 
            sans: ['Inter', 'sans-serif'], 
            display: ['Montserrat', 'sans-serif'] 
          }
        }
      }
    }
  </script>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
  
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body { font-family: 'Inter', sans-serif; background-color: #ffffff; color: #0f172a; -webkit-font-smoothing: antialiased; }
    .btn-premium { background: #075985; color: white; transition: all 0.3s ease; }
    .btn-premium:hover { background: #0c4a6e; transform: translateY(-2px); }
    .section-title { font-family: 'Montserrat', sans-serif; font-weight: 800; color: #075985; text-transform: uppercase; letter-spacing: 0.05em; font-size: 1.25rem; margin-bottom: 1.5rem; }
    .description-text { font-size: 1.125rem; line-height: 1.75; color: #334155; margin-bottom: 2rem; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const product = {
    "id": 3,
    "slug": "estaxine",
    "name": "Estaxine",
    "subName": "Astaxanthine Naturelle",
    "description": "L'antioxydant le plus puissant du monde marin. Une protection d'exception contre le vieillissement cellulaire et les agressions ext\u00e9rieures.",
    "price": 65.0,
    "image": "./produits/astaxanthine.png",
    "rating": 4.9,
    "reviews": 156,
    "composition": [
        [
            "Astaxanthine naturelle",
            "4mg"
        ],
        [
            "Huile de carthame",
            "q.s."
        ],
        [
            "Vitamine E",
            "2mg"
        ]
    ],
    "benefits": [
        "Haute protection contre le stress oxydatif",
        "Am\u00e9liore la r\u00e9cup\u00e9ration musculaire",
        "Sant\u00e9 oculaire et cutan\u00e9e"
    ],
    "usage": "1 g\u00e9lule par jour \u00e0 prendre imp\u00e9rativement au cours d'un repas gras.",
    "precautions": "Usage r\u00e9serv\u00e9 \u00e0 l'adulte. Avis m\u00e9dical si anticoagulant.",
    "storage": "Prot\u00e9ger de la chaleur et de l'humidit\u00e9."
};

    const Navbar = () => (
      <header className="fixed w-full z-50 bg-white border-b border-nude-warm h-[120px] flex items-center">
        <nav className="max-w-7xl mx-auto px-6 w-full flex justify-between items-center">
          <a href="index.html" className="flex items-center">
            <img src="logo-bionova.png" alt="Logo Bionova" className="h-[80px] md:h-[100px]" />
          </a>
          <div className="hidden lg:flex space-x-10">
            {['Accueil', 'Boutique', 'Astuces', 'Expertise'].map((item, i) => (
              <a key={i} href={item === 'Accueil' ? 'index.html' : `index.html#${item.toLowerCase()}`} className="text-lg font-bold uppercase tracking-widest text-medical-blue hover:opacity-70 transition-opacity">
                {item}
              </a>
            ))}
          </div>
          <button className="bg-medical-blue text-white px-6 py-3 rounded-xl font-bold uppercase tracking-widest text-sm shadow-md">Mon Panier</button>
        </nav>
      </header>
    );

    const StarRating = ({ rating, reviews }) => (
      <div className="flex items-center space-x-1 mb-4">
        {[...Array(5)].map((_, i) => (
          <svg key={i} className={`w-5 h-5 ${i < Math.floor(rating) ? 'text-medical-blue fill-medical-blue' : 'text-nude-warm fill-nude-warm'}`} viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z" /></svg>
        ))}
        <span className="text-xs font-bold text-medical-blue/40 ml-3 uppercase tracking-widest">{reviews} avis</span>
      </div>
    );

    const ProductPage = () => (
      <div className="min-h-screen bg-white">
        <Navbar />
        
        <main className="pt-40 pb-20">
          <div className="max-w-6xl mx-auto px-6">
            
            {/* Breadcrumb */}
            <nav className="mb-10 text-[11px] font-bold uppercase tracking-[0.2em] text-medical-blue/30">
              <a href="index.html" className="hover:text-medical-blue">Bionova</a> / <a href="index.html#products" className="hover:text-medical-blue">Boutique</a> / <span className="text-medical-blue">{product.name}</span>
            </nav>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-16 items-start">
              
              {/* Photo du produit */}
              <div className="sticky top-40 bg-nude-soft rounded-[2.5rem] p-10 flex items-center justify-center aspect-square border border-nude-warm">
                 <img src={product.image} alt={product.name} className="w-full h-full object-contain drop-shadow-xl" />
              </div>

              {/* Contenu détaillé */}
              <div className="flex flex-col">
                <h1 className="font-display text-4xl lg:text-5xl font-extrabold text-medical-blue mb-2">{product.name}</h1>
                <p className="text-xl text-medical-blue/40 font-bold uppercase tracking-widest mb-10">{product.subName}</p>

                <div className="flex justify-between items-center mb-10 pb-10 border-b border-nude-warm">
                  <div className="flex flex-col">
                    <span className="text-4xl font-black text-medical-blue">{product.price.toFixed(2)} DT</span>
                    <span className="text-[10px] font-bold text-gray-400 uppercase mt-1">TVA incluse - Livraison express</span>
                  </div>
                  <button className="btn-premium px-10 py-5 rounded-2xl font-bold uppercase tracking-widest shadow-lg">Ajouter au panier</button>
                </div>

                {/* --- ORGANISATION VISUELLE SOUS LA PHOTO/PRIX --- */}
                
                {/* 1. Avis Étoiles */}
                <StarRating rating={product.rating} reviews={product.reviews} />

                {/* 2. Description Générale */}
                <section className="mb-12">
                  <h2 className="section-title">Description</h2>
                  <p className="description-text">{product.description}</p>
                </section>

                {/* 3. Composition */}
                <section className="mb-12 bg-white rounded-3xl border border-nude-warm overflow-hidden">
                  <div className="bg-nude-soft px-8 py-4 border-b border-nude-warm">
                    <h2 className="text-sm font-black text-medical-blue uppercase tracking-widest mb-0">Composition <span className="text-xs font-bold text-medical-blue/40 ml-2">(pour 1 gélule)</span></h2>
                  </div>
                  <table className="w-full text-left">
                    <tbody className="divide-y divide-nude-warm">
                      {product.composition.map((row, i) => (
                        <tr key={i}>
                          <td className="py-4 px-8 font-semibold text-gray-700">{row[0]}</td>
                          <td className="py-4 px-8 text-medical-blue font-bold text-right">{row[1]}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </section>

                {/* 4. Bienfaits */}
                <section className="mb-12">
                  <h2 className="section-title">Bienfaits</h2>
                  <ul className="space-y-4">
                    {product.benefits.map((benefit, i) => (
                      <li key={i} className="flex items-center text-gray-600">
                        <div className="w-2 h-2 bg-medical-blue rounded-full mr-4 shrink-0"></div>
                        <span className="font-medium">{benefit}</span>
                      </li>
                    ))}
                  </ul>
                </section>

                {/* 5. Conseils d'utilisation */}
                <section className="bg-nude-soft p-10 rounded-[2.5rem] border border-nude-warm relative">
                  <div className="absolute -top-4 left-10 bg-medical-blue text-white px-6 py-2 rounded-full text-[10px] font-black uppercase tracking-[0.2em] shadow-md">
                    Conseil d'expert
                  </div>
                  <h2 className="font-display text-xl font-bold text-medical-blue mb-4">Posologie & Conseils</h2>
                  <p className="text-medical-blue/70 leading-relaxed font-medium italic mb-6">"{product.usage}"</p>
                  <div className="flex items-start space-x-4 pt-6 border-t border-medical-blue/10">
                    <div className="flex flex-col">
                      <span className="text-[10px] font-black text-medical-blue/30 uppercase tracking-widest mb-1">Précaution</span>
                      <p className="text-xs text-medical-blue/60 font-bold">{product.precautions}</p>
                    </div>
                  </div>
                </section>

              </div>
            </div>
          </div>
        </main>

        <footer className="bg-white border-t border-nude-warm py-20 text-center">
          <p className="text-medical-blue/20 text-xs font-bold uppercase tracking-[0.4em]">&copy; 2026 Laboratoire Bionova - Tunis</p>
        </footer>
      </div>
    );

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<ProductPage />);
  </script>
</body>
</html>
